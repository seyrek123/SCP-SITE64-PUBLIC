<body>

<main>


<!-- =====================================================
     HEADER
===================================================== -->

<section class="header">

<div class="header-label">

SECURE CONTAIN PROTECT // O5 AUTHORIZATION

</div>

<h1>
WARHEAD CONTROL
</h1>

<div class="header-description">

STRATEGIC FACILITY TERMINATION SYSTEM

</div>

</section>


<!-- =====================================================
     STATUS
===================================================== -->

<section class="status-panel">

<div class="status-title">

CURRENT WARHEAD STATUS

</div>


<div class="status-grid">


<div class="status-box">

<span>
STATUS
</span>

<strong id="status">
LOADING...
</strong>

</div>


<div class="status-box">

<span>
WARHEAD TYPE
</span>

<strong id="type">
NONE
</strong>

</div>


<div class="status-box">

<span>
ACTIVATED
</span>

<strong id="activated">
N/A
</strong>

</div>


</div>


<div
    id="systemMessage"
    class="system-message"
></div>


<button
    id="deactivateButton"
    class="deactivate-button"
    onclick="deactivateWarhead()"
>
DEACTIVATE WARHEAD
</button>

</section>


<!-- =====================================================
     WARHEADS
===================================================== -->

<section
    id="warheadGrid"
    class="warhead-grid"
>
</section>


<a
    class="back"
    href="/"
>
RETURN TO HOME
</a>


</main>


<script>

/* =====================================================
   GLOBAL DATA
===================================================== */

let warheadData = null;


/* =====================================================
   LOAD WARHEAD
===================================================== */

async function loadWarhead() {

    try {

        const response =
            await fetch(
                "/api/warhead",
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                "WARHEAD SYSTEM ERROR."
            );
        }


        warheadData =
            data;


        updateStatus();

        renderWarheads();


    } catch (error) {

        document.getElementById(
            "status"
        ).textContent =
            "OFFLINE";


        document.getElementById(
            "type"
        ).textContent =
            "UNKNOWN";


        showMessage(
            "WARHEAD SYSTEM CONNECTION ERROR."
        );
    }
}


/* =====================================================
   UPDATE STATUS
===================================================== */

function updateStatus() {

    if (!warheadData) {
        return;
    }


    const warhead =
        warheadData.warhead;


    document.getElementById(
        "status"
    ).textContent =
        warhead.status ||
        "STANDBY";


    document.getElementById(
        "type"
    ).textContent =
        warhead.type ||
        "NONE";


    document.getElementById(
        "activated"
    ).textContent =
        warhead.activatedAt
            ? new Date(
                warhead.activatedAt
              ).toLocaleString()
            : "N/A";


    const deactivateButton =
        document.getElementById(
            "deactivateButton"
        );


    deactivateButton.style.display =
        warhead.active
            ? "block"
            : "none";


    if (warhead.message) {

        showMessage(
            warhead.message
        );

    } else {

        hideMessage();
    }
}


/* =====================================================
   RENDER WARHEADS
===================================================== */

function renderWarheads() {

    const container =
        document.getElementById(
            "warheadGrid"
        );


    if (
        !warheadData ||
        !warheadData.types
    ) {

        container.innerHTML =
            "";

        return;
    }


    const activeType =
        warheadData.warhead.type;


    container.innerHTML =
        Object.values(
            warheadData.types
        )
        .map(
            warhead => {

                const isActive =
                    activeType ===
                    warhead.name;


                return `

                <article
                    class="warhead-card
                    ${isActive ? "active" : ""}"
                >

                    <div class="warhead-name">

                        ${escapeHtml(
                            warhead.name
                        )}

                    </div>


                    <div class="warhead-effect">

                        EFFECT:
                        ${escapeHtml(
                            warhead.effect
                        )}

                    </div>


                    <div class="warhead-description">

                        ${escapeHtml(
                            warhead.description
                        )}

                    </div>


                    <button
                        class="activate-button"
                        onclick="activateWarhead(
                            '${escapeJs(
                                warhead.name
                            )}'
                        )"
                        ${
                            warheadData.warhead.active
                                ? "disabled"
                                : ""
                        }
                    >

                        ACTIVATE
                        ${escapeHtml(
                            warhead.name
                        )}

                    </button>

                </article>

                `;
            }
        )
        .join("");
}


/* =====================================================
   ACTIVATE WARHEAD
===================================================== */

async function activateWarhead(type) {


    /* -------------------------------------------------
       AUTHORIZATION CODE
    ------------------------------------------------- */

    const code =
        prompt(
            "WARHEAD AUTHORIZATION REQUIRED\n\n" +
            "ENTER AUTHORIZATION CODE:"
        );


    if (code === null) {
        return;
    }


    if (
        code.trim().toUpperCase() !==
        "WARHEAD"
    ) {

        alert(
            "AUTHORIZATION DENIED.\n\n" +
            "INVALID WARHEAD CODE."
        );

        return;
    }


    /* -------------------------------------------------
       FINAL CONFIRMATION
    ------------------------------------------------- */

    const confirmed =
        confirm(
            "⚠ WARHEAD ACTIVATION WARNING ⚠\n\n" +

            "WARHEAD: " +
            type +
            "\n\n" +

            "AUTHORIZATION ACCEPTED.\n\n" +

            "CONFIRM ACTIVATION?"
        );


    if (!confirmed) {
        return;
    }


    /* -------------------------------------------------
       API
    ------------------------------------------------- */

    try {

        const response =
            await fetch(
                "/api/warhead/activate",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            type:
                                type
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "WARHEAD ACTIVATION FAILED."
            );

            return;
        }


        alert(
            "AUTHORIZATION ACCEPTED.\n\n" +

            type +

            " WARHEAD IS NOW ARMED."
        );


        await loadWarhead();


    } catch (error) {

        alert(
            "WARHEAD SYSTEM CONNECTION ERROR."
        );
    }
}


/* =====================================================
   DEACTIVATE WARHEAD
===================================================== */

async function deactivateWarhead() {


    const confirmed =
        confirm(
            "DEACTIVATE ACTIVE WARHEAD?\n\n" +
            "This will return the system to STANDBY."
        );


    if (!confirmed) {
        return;
    }


    /* -------------------------------------------------
       REQUIRE CODE AGAIN
    ------------------------------------------------- */

    const code =
        prompt(
            "WARHEAD AUTHORIZATION REQUIRED\n\n" +
            "ENTER AUTHORIZATION CODE:"
        );


    if (code === null) {
        return;
    }


    if (
        code.trim().toUpperCase() !==
        "WARHEAD"
    ) {

        alert(
            "AUTHORIZATION DENIED.\n\n" +
            "INVALID WARHEAD CODE."
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/warhead/deactivate",
                {
                    method:
                        "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "WARHEAD DEACTIVATION FAILED."
            );

            return;
        }


        alert(
            "WARHEAD DEACTIVATED.\n\n" +
            "SYSTEM STATUS: STANDBY"
        );


        await loadWarhead();


    } catch (error) {

        alert(
            "WARHEAD SYSTEM CONNECTION ERROR."
        );
    }
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

    const element =
        document.getElementById(
            "systemMessage"
        );


    element.style.display =
        "block";


    element.textContent =
        text;
}


function hideMessage() {

    const element =
        document.getElementById(
            "systemMessage"
        );


    element.style.display =
        "none";


    element.textContent =
        "";
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   JAVASCRIPT STRING ESCAPE
===================================================== */

function escapeJs(value) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );
}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadWarhead();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadWarhead,
    5000
);

</script>

</body>

</html>
