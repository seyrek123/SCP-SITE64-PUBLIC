<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SITE-64 // Administration</title>

    <link
        rel="stylesheet"
        href="script.css"
    >

    <style>

        body {
            background:
                #020202;
        }

        .admin-shell {
            width: min(1200px, 94%);
            margin: 0 auto;
            padding: 40px 0 80px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #2b0000;
            padding-bottom: 25px;
            margin-bottom: 25px;
        }

        .admin-title small {
            color: #777;
            letter-spacing: 3px;
        }

        .admin-title h1 {
            margin: 8px 0 0;
            color: #fff;
            letter-spacing: 4px;
        }

        .admin-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-nav button {
            background: #090909;
            color: #aaa;
            border: 1px solid #292929;
            padding: 12px 18px;
            cursor: pointer;
            transition: .2s;
        }

        .admin-nav button:hover,
        .admin-nav button.active {
            color: #fff;
            background: #180000;
            border-color: #8b0000;
        }

        .admin-page {
            display: none;
        }

        .admin-page.active {
            display: block;
        }

        .panel {
            background: #070707;
            border: 1px solid #242424;
            padding: 24px;
            margin-bottom: 20px;
        }

        .panel-title {
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .request-card {
            background: #050505;
            border: 1px solid #242424;
            padding: 20px;
            margin-bottom: 14px;
        }

        .request-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .request-card-top strong {
            color: #fff;
        }

        .status {
            padding: 5px 10px;
            font-size: 11px;
            letter-spacing: 1px;
            border: 1px solid #333;
        }

        .status.pending {
            color: #ddd;
        }

        .status.approved {
            color: #78ff78;
            border-color: #285c28;
        }

        .status.rejected {
            color: #ff5555;
            border-color: #6b0000;
        }

        .request-info {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 10px;
        }

        .request-info div {
            background: #090909;
            border: 1px solid #1d1d1d;
            padding: 12px;
            color: #777;
            font-size: 11px;
        }

        .request-info strong {
            display: block;
            color: #fff;
            margin-top: 6px;
        }

        .admin-message,
        .site-form input,
        .site-form textarea,
        .site-form select {
            width: 100%;
            box-sizing: border-box;
            background: #030303;
            border: 1px solid #292929;
            color: #fff;
            padding: 12px;
            outline: none;
        }

        .admin-message {
            min-height: 90px;
            resize: vertical;
            margin-top: 10px;
        }

        .admin-message:focus,
        .site-form input:focus,
        .site-form textarea:focus,
        .site-form select:focus {
            border-color: #790000;
        }

        .admin-controls {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .admin-controls button,
        .site-form button {
            padding: 12px;
            border: 1px solid #650000;
            background: #180000;
            color: #fff;
            cursor: pointer;
        }

        .admin-controls button:hover,
        .site-form button:hover {
            background: #300000;
        }

        .site-form {
            display: grid;
            gap: 12px;
        }

        .site-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .site-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }

        .site-card {
            background: #050505;
            border: 1px solid #292929;
            padding: 20px;
            position: relative;
        }

        .site-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #750000;
        }

        .site-card h3 {
            color: #fff;
            margin: 0 0 5px;
        }

        .site-code {
            color: #d00000;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .site-status {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 9px;
            border: 1px solid #333;
            color: #aaa;
            font-size: 11px;
        }

        .site-description {
            color: #777;
            line-height: 1.6;
            margin-top: 15px;
        }

        .delete-site {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #180000;
            color: #fff;
            border: 1px solid #600000;
            cursor: pointer;
        }

        .terminal {
            background: #010101;
            border: 1px solid #292929;
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .terminal-bar {
            padding: 12px 16px;
            background: #090909;
            border-bottom: 1px solid #292929;
            color: #a00000;
            font-size: 12px;
            letter-spacing: 2px;
        }

        #terminalOutput {
            flex: 1;
            min-height: 350px;
            padding: 18px;
            color: #ddd;
            font-family:
                Consolas,
                "Courier New",
                monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        .terminal-input {
            display: flex;
            border-top: 1px solid #292929;
        }

        .terminal-input span {
            padding: 14px;
            color: #b00000;
            font-family: monospace;
        }

        #terminalCommand {
            flex: 1;
            background: #030303;
            border: 0;
            color: #fff;
            outline: none;
            font-family: monospace;
            padding: 14px 5px;
        }

        .empty-request {
            padding: 30px;
            text-align: center;
            color: #666;
            border: 1px solid #222;
        }

        @media (max-width: 700px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .request-info {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>
</head>

<body>

<div class="admin-shell">

    <header class="admin-header">

        <div class="admin-title">

            <small>
                SECURECONTAINPROTECT // SITE-64
            </small>

            <h1>
                ADMINISTRATION
            </h1>

        </div>

        <nav class="admin-nav">

            <button
                class="admin-tab active"
                data-page="requests">
                REQUESTS
            </button>

            <button
                class="admin-tab"
                data-page="sites">
                SITES
            </button>

            <button
                class="admin-tab"
                data-page="terminal">
                TERMINAL
            </button>

        </nav>

    </header>


    <!-- REQUESTS -->

    <section
        id="requests"
        class="admin-page active">

        <div class="panel">

            <div class="panel-title">
                REQUEST DATABASE
            </div>

            <div id="adminRequests"></div>

        </div>

    </section>


    <!-- SITES -->

    <section
        id="sites"
        class="admin-page">

        <div class="panel">

            <div class="panel-title">
                SITE REGISTRY
            </div>

            <form
                id="siteForm"
                class="site-form">

                <input
                    id="siteName"
                    type="text"
                    placeholder="Site Name"
                    required
                >

                <input
                    id="siteCode"
                    type="text"
                    placeholder="Site Code"
                    required
                >

                <input
                    id="siteLocation"
                    type="text"
                    placeholder="Location"
                >

                <select id="siteStatus">

                    <option>
                        OPERATIONAL
                    </option>

                    <option>
                        LOCKDOWN
                    </option>

                    <option>
                        CONTAINMENT BREACH
                    </option>

                    <option>
                        OFFLINE
                    </option>

                    <option>
                        CLASSIFIED
                    </option>

                </select>

                <textarea
                    id="siteDescription"
                    placeholder="Site Description">
                </textarea>

                <button type="submit">
                    REGISTER SITE
                </button>

            </form>

        </div>


        <div class="panel">

            <div class="panel-title">
                REGISTERED SITES
            </div>

            <div
                id="siteGrid"
                class="site-grid">
            </div>

        </div>

    </section>


    <!-- TERMINAL -->

    <section
        id="terminal"
        class="admin-page">

        <div class="panel">

            <div class="panel-title">
                SITE-64 TERMINAL
            </div>

            <div class="terminal">

                <div class="terminal-bar">
                    O5 ADMIN TERMINAL // ONLINE
                </div>

                <div id="terminalOutput">
SITE-64 TERMINAL
SYSTEM READY.

Type "help" for available commands.
                </div>

                <div class="terminal-input">

                    <span>&gt;</span>

                    <input
                        id="terminalCommand"
                        type="text"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="Enter command..."
                    >

                </div>

            </div>

        </div>

    </section>

</div>

<script src="admin.js"></script>

</body>
</html>
