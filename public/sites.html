<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SITE-64 // FACILITIES</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #111827, #030507 65%);
            color: #e5e7eb;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #05080d;
            border-bottom: 1px solid #26313d;
            padding: 24px 35px;
        }

        .title {
            color: #38bdf8;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #64748b;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        main {
            width: min(1100px, calc(100% - 30px));
            margin: 35px auto;
        }

        .sites {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 18px;
        }

        .site {
            border: 1px solid #334155;
            background: #080c12;
            padding: 25px;
            min-height: 190px;
            text-decoration: none;
            color: white;
            transition: .2s;
        }

        .site:hover {
            border-color: #38bdf8;
            transform: translateY(-3px);
        }

        .site-name {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .status {
            margin-top: 20px;
            color: #22c55e;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .description {
            margin-top: 12px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }

        .return {
            display: inline-block;
            margin-top: 30px;
            border: 1px solid #334155;
            padding: 13px 18px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .return:hover {
            border-color: #38bdf8;
            color: white;
        }

        @media(max-width: 750px) {
            .sites {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="title">
        SCP FOUNDATION // SITES
    </div>

    <div class="subtitle">
        FACILITY STATUS NETWORK
    </div>
</header>

<main>

    <div class="sites">

        <a class="site" href="/sites#SITE-19">
            <div class="site-name">
                SITE-19
            </div>

            <div
                id="status19"
                class="status"
            >
                NORMAL
            </div>

            <div class="description">
                PRIMARY SCP CONTAINMENT FACILITY.
            </div>
        </a>


        <a class="site" href="/sites#SITE-51">
            <div class="site-name">
                SITE-51
            </div>

            <div
                id="status51"
                class="status"
            >
                NORMAL
            </div>

            <div class="description">
                SECURE RESEARCH AND CONTAINMENT FACILITY.
            </div>
        </a>


        <a class="site" href="/sites#SITE-64">
            <div class="site-name">
                SITE-64
            </div>

            <div
                id="status64"
                class="status"
            >
                NORMAL
            </div>

            <div class="description">
                SITE-64 ADMINISTRATION FACILITY.
            </div>
        </a>

    </div>

    <a
        class="return"
        href="/warhead"
    >
        ← RETURN TO WARHEAD CONTROL
    </a>

</main>


<script>

    async function loadSites() {

        try {

            const response =
                await fetch(
                    "/api/sites"
                );

            const data =
                await response.json();

            if (!data.success) {
                return;
            }

            const sites =
                data.sites;


            updateSite(
                "status19",
                sites["SITE-19"]
            );

            updateSite(
                "status51",
                sites["SITE-51"]
            );

            updateSite(
                "status64",
                sites["SITE-64"]
            );

        } catch {

            console.log(
                "SITE STATUS CONNECTION ERROR."
            );
        }
    }


    function updateSite(
        elementId,
        site
    ) {

        const element =
            document.getElementById(
                elementId
            );

        if (!element || !site) {
            return;
        }

        element.textContent =
            site.status ||
            "NORMAL";

        if (
            site.status !==
            "NORMAL"
        ) {

            element.style.color =
                "#ef4444";

        } else {

            element.style.color =
                "#22c55e";
        }
    }


    loadSites();

</script>

</body>
</html>
