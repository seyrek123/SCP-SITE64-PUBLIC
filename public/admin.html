<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SITE-64 // ADMIN</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05080c;
    color: #e8edf2;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 6%;
    border-bottom: 1px solid #202832;

    display: flex;
    justify-content: space-between;
}

header strong {
    letter-spacing: 2px;
}

header span {
    color: #6d7986;
    font-size: 11px;
}

main {
    width: min(1100px, 92%);
    margin: auto;
    padding: 50px 0;
}

.login {
    width: min(420px, 100%);
    margin: 100px auto;
}

h1 {
    letter-spacing: 3px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 8px;

    background: #090e13;
    border: 1px solid #29333e;

    color: white;
}

button {
    padding: 12px 20px;
    margin-top: 10px;

    background: #111923;
    border: 1px solid #354454;

    color: white;

    cursor: pointer;
}

button:hover {
    border-color: #66829d;
}

.hidden {
    display: none;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
}

.card {
    background: #090e13;
    border: 1px solid #202a34;
    padding: 22px;
    margin-bottom: 15px;
}

.card-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.id {
    font-weight: bold;
    letter-spacing: 1px;
}

.status {
    font-size: 11px;
    padding: 5px 9px;
    border: 1px solid #354454;
}

.info {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.info div {
    border-top: 1px solid #202832;
    padding-top: 10px;
}

.info span {
    display: block;
    color: #65717e;
    font-size: 9px;
    margin-bottom: 5px;
}

.info strong {
    font-size: 12px;
}

.message {
    margin-top: 20px;
    padding: 15px;
    background: #070b10;
    color: #9aa5b0;
    line-height: 1.6;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

#error {
    color: #ff7474;
    margin-top: 10px;
}

#success {
    color: #85d69e;
    margin-top: 10px;
}

@media (max-width: 700px) {

    .info {
        grid-template-columns: 1fr 1fr;
    }
}

</style>

</head>

<body>

<header>

<strong>
SECURECONTAINPROTECT // ADMIN
</strong>

<span>
SITE-64
</span>

</header>


<main>

<div
    id="loginPanel"
    class="login"
>

<h1>
ADMIN ACCESS
</h1>

<p>
AUTHORIZED PERSONNEL ONLY.
</p>

<input
    id="password"
    type="password"
    placeholder="ADMIN PASSWORD"
>

<button onclick="login()">
AUTHENTICATE
</button>

<div id="error"></div>

</div>


<div
    id="adminPanel"
    class="hidden"
>

<div class="toolbar">

<div>

<h1>
REQUEST DATABASE
</h1>

<span id="count">
0 REQUESTS
</span>

</div>

<div>

<button onclick="loadRequests()">
REFRESH
</button>

<button onclick="logout()">
LOGOUT
</button>

</div>

</div>


<div id="requests">
LOADING...
</div>

</div>

</main>


<script>

let adminPassword =
    sessionStorage.getItem(
        "SITE64_ADMIN_PASSWORD"
    );


async function login() {

    const password =
        document
            .getElementById("password")
            .value;

    const error =
        document.getElementById(
            "error"
        );

    error.textContent = "";

    if (!password) {

        error.textContent =
            "PASSWORD REQUIRED.";

        return;
    }

    try {

        const response =
            await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            password
                        })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                "ACCESS DENIED."
            );
        }

        adminPassword =
            password;

        sessionStorage.setItem(
            "SITE64_ADMIN_PASSWORD",
            password
        );

        showAdmin();

    } catch (error) {

        errorElement =
            document.getElementById(
                "error"
            );

        errorElement.textContent =
            error.message;
    }
}


function showAdmin() {

    document
        .getElementById(
            "loginPanel"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "adminPanel"
        )
        .classList.remove(
            "hidden"
        );

    loadRequests();
}


function logout() {

    sessionStorage.removeItem(
        "SITE64_ADMIN_PASSWORD"
    );

    location.reload();
}


async function loadRequests() {

    const container =
        document.getElementById(
            "requests"
        );

    try {

        const response =
            await fetch(
                "/api/requests/admin",
                {
                    headers: {
                        "x-admin-password":
                            adminPassword
                    }
                }
            );

        if (
            response.status === 401
        ) {

            logout();
            return;
        }

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(
                "FAILED TO LOAD REQUESTS."
            );
        }

        const requests =
            data.requests || [];

        document
            .getElementById(
                "count"
            )
            .textContent =
                requests.length +
                " REQUESTS";

        if (!requests.length) {

            container.innerHTML =
                "<p>NO REQUESTS FOUND.</p>";

            return;
        }

        container.innerHTML =
            requests
                .map(
                    createCard
                )
                .join("");

    } catch (error) {

        container.innerHTML =
            `<p style="color:#ff7474">
                ${escapeHtml(
                    error.message
                )}
            </p>`;
    }
}


function createCard(request) {

    return `
        <article class="card">

            <div class="card-top">

                <span class="id">
                    ${escapeHtml(
                        request.id
                    )}
                </span>

                <span class="status">
                    ${escapeHtml(
                        request.status
                    )}
                </span>

            </div>


            <div class="info">

                <div>
                    <span>NAME</span>
                    <strong>
                        ${escapeHtml(
                            request.name
                        )}
                    </strong>
                </div>

                <div>
                    <span>TYPE</span>
                    <strong>
                        ${escapeHtml(
                            request.typeName
                        )}
                    </strong>
                </div>

                <div>
                    <span>SCP</span>
                    <strong>
                        ${escapeHtml(
                            request.scp ||
                            "N/A"
                        )}
                    </strong>
                </div>

                <div>
                    <span>TIME</span>
                    <strong>
                        ${escapeHtml(
                            request.time
                        )}
                    </strong>
                </div>

            </div>


            <div class="message">

                ${escapeHtml(
                    request.message ||
                    "NO MESSAGE."
                )}

            </div>


            <div class="actions">

                <button
                    onclick="approve(
                        '${request.id}'
                    )"
                >
                    APPROVE
                </button>


                <button
                    onclick="reject(
                        '${request.id}'
                    )"
                >
                    REJECT
                </button>


                <button
                    onclick="changeTime(
                        '${request.id}'
                    )"
                >
                    CHANGE TIME
                </button>

            </div>

        </article>
    `;
}


async function approve(id) {

    const message =
        prompt(
            "ADMIN MESSAGE:",
            "YOUR REQUEST HAS BEEN ACCEPTED."
        );

    if (message === null) {
        return;
    }

    await sendAction(
        `/api/requests/${id}/approve`,
        {
            message
        }
    );
}


async function reject(id) {

    const message =
        prompt(
            "REJECTION MESSAGE:",
            "YOUR REQUEST HAS BEEN REJECTED."
        );

    if (message === null) {
        return;
    }

    await sendAction(
        `/api/requests/${id}/reject`,
        {
            message
        }
    );
}


async function changeTime(id) {

    const time =
        prompt(
            "NEW TIME (12:00 - 00:00):",
            "12:00"
        );

    if (time === null) {
        return;
    }

    await sendAction(
        `/api/requests/${id}/time`,
        {
            time
        }
    );
}


async function sendAction(
    url,
    body
) {

    try {

        const response =
            await fetch(
                url,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "x-admin-password":
                            adminPassword
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        const data =
            await response.json();

        if (
            response.status === 401
        ) {

            logout();
            return;
        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                "ACTION FAILED."
            );
        }

        loadRequests();

    } catch (error) {

        alert(
            error.message
        );
    }
}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


if (adminPassword) {

    showAdmin();
}

</script>

</body>

</html>
