<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SITE-64 // ADMIN</title>

<link
    rel="stylesheet"
    href="/script.css"
>

<style>

.admin-container {
    max-width: 1200px;
    margin: auto;
    padding: 120px 5% 60px;
}

.login {
    max-width: 400px;
    margin: 80px auto;
}

.login input,
.login button {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 12px;
}

.dashboard {
    display: none;
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.stat {
    padding: 20px;
    border: 1px solid #26343d;
}

.stat span {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
}

.stat strong {
    display: block;
    font-size: 28px;
    margin-top: 8px;
}

.request {
    border: 1px solid #26343d;
    padding: 22px;
    margin-bottom: 18px;
}

.request-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.request-info {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 10px;
}

.info {
    border: 1px solid #202b33;
    padding: 12px;
}

.info small {
    display: block;
    opacity: .6;
    font-size: 9px;
    letter-spacing: 2px;
}

.time-area {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #26343d;
}

.time-area select {
    min-width: 200px;
}

.message {
    width: 100%;
    box-sizing: border-box;
    min-height: 80px;
    margin-top: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.buttons button {
    padding: 12px 18px;
    cursor: pointer;
}

.success {
    color: #83cda4;
}

.error {
    color: #d88383;
}

@media(max-width:700px) {

    .stats,
    .request-info {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<header class="topbar">

    <div class="brand">

        <div class="brand-title">
            SCP FOUNDATION
        </div>

        <div class="brand-subtitle">
            SITE-64 ADMINISTRATION
        </div>

    </div>

</header>


<main class="admin-container">


<section
    id="login"
    class="login"
>

    <h1>
        ADMIN ACCESS
    </h1>

    <p>
        Restricted SITE-64 administration system.
    </p>


    <input
        id="password"
        type="password"
        placeholder="ACCESS CODE"
    >


    <button
        id="loginButton"
    >
        ACCESS SYSTEM
    </button>


    <p
        id="loginError"
        class="error"
        style="display:none;"
    >
        ACCESS DENIED.
    </p>

</section>


<section
    id="dashboard"
    class="dashboard"
>

    <h1>
        SITE-64 CONTROL
    </h1>


    <div class="stats">

        <div class="stat">
            <span>TOTAL</span>
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            <span>PENDING</span>
            <strong id="pending">0</strong>
        </div>

        <div class="stat">
            <span>APPROVED</span>
            <strong id="approved">0</strong>
        </div>

        <div class="stat">
            <span>REJECTED</span>
            <strong id="rejected">0</strong>
        </div>

    </div>


    <div id="message"></div>


    <div id="requests"></div>

</section>


</main>


<script>

const ADMIN_PASSWORD =
    "SITE64-O5";


const TIMES = [

    "12:00 PM",
    "12:30 PM",

    "1:00 PM",
    "1:30 PM",

    "2:00 PM",
    "2:30 PM",

    "3:00 PM",
    "3:30 PM",

    "4:00 PM",
    "4:30 PM",

    "5:00 PM",
    "5:30 PM",

    "6:00 PM",
    "6:30 PM",

    "7:00 PM",
    "7:30 PM",

    "8:00 PM",
    "8:30 PM",

    "9:00 PM",
    "9:30 PM",

    "10:00 PM",
    "10:30 PM",

    "11:00 PM",
    "11:30 PM",

    "12:00 AM"

];


let requests = [];


document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        login
    );


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {
                login();
            }

        }
    );


function login() {

    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    if (
        password !==
        ADMIN_PASSWORD
    ) {

        document
            .getElementById(
                "loginError"
            )
            .style.display =
                "block";

        return;
    }


    document
        .getElementById(
            "login"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "dashboard"
        )
        .style.display =
            "block";


    loadRequests();
}


async function loadRequests() {

    try {

        const response =
            await fetch(
                "/api/requests"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "DATABASE ERROR."
            );
        }


        requests =
            Array.isArray(
                data.requests
            )
                ? data.requests
                : [];


        updateStats();

        render();

    } catch (error) {

        showMessage(
            error.message,
            true
        );
    }
}


function updateStats() {

    document
        .getElementById(
            "total"
        )
        .textContent =
            requests.length;


    document
        .getElementById(
            "pending"
        )
        .textContent =
            requests.filter(
                r =>
                    r.status ===
                    "PENDING"
            ).length;


    document
        .getElementById(
            "approved"
        )
        .textContent =
            requests.filter(
                r =>
                    r.status ===
                    "APPROVED"
            ).length;


    document
        .getElementById(
            "rejected"
        )
        .textContent =
            requests.filter(
                r =>
                    r.status ===
                    "REJECTED"
            ).length;
}


function render() {

    const container =
        document.getElementById(
            "requests"
        );


    if (!requests.length) {

        container.innerHTML =
            "<p>NO REQUESTS FOUND.</p>";

        return;
    }


    container.innerHTML =
        requests
            .slice()
            .reverse()
            .map(
                requestCard
            )
            .join("");
}


function requestCard(request) {

    const options =
        TIMES.map(
            time => {

                const selected =
                    time ===
                    request.time
                        ? "selected"
                        : "";


                return `
                    <option
                        value="${time}"
                        ${selected}
                    >
                        ${time}
                    </option>
                `;
            }
        )
        .join("");


    return `

        <article class="request">

            <div class="request-header">

                <strong>
                    ${escapeHtml(
                        request.id
                    )}
                </strong>

                <strong>
                    ${escapeHtml(
                        request.status
                    )}
                </strong>

            </div>


            <div class="request-info">

                <div class="info">
                    <small>NAME</small>
                    ${escapeHtml(
                        request.name
                    )}
                </div>

                <div class="info">
                    <small>TYPE</small>
                    ${escapeHtml(
                        request.typeName ||
                        request.type
                    )}
                </div>

                <div class="info">
                    <small>SCP</small>
                    ${escapeHtml(
                        request.scp ||
                        "N/A"
                    )}
                </div>

                <div class="info">
                    <small>TIME</small>
                    ${escapeHtml(
                        request.time
                    )}
                </div>

                <div class="info">
                    <small>PERIOD</small>
                    ${escapeHtml(
                        request.period
                    )}
                </div>

                <div class="info">
                    <small>CREATED</small>
                    ${escapeHtml(
                        request.createdAt
                    )}
                </div>

            </div>


            <div class="time-area">

                <strong>
                    CHANGE REQUEST TIME
                </strong>


                <br><br>


                <select
                    id="time-${escapeHtml(
                        request.id
                    )}"
                >

                    ${options}

                </select>


                <button
                    onclick="changeTime(
                        '${escapeJs(
                            request.id
                        )}'
                    )"
                >
                    CHANGE TIME
                </button>

            </div>


            <textarea
                id="message-${escapeHtml(
                    request.id
                )}"
                class="message"
                placeholder="ADMIN MESSAGE..."
            ></textarea>


            <div class="buttons">

                ${
                    request.status ===
                    "PENDING"

                    ? `

                    <button
                        onclick="approve(
                            '${escapeJs(
                                request.id
                            )}'
                        )"
                    >
                        APPROVE
                    </button>

                    <button
                        onclick="reject(
                            '${escapeJs(
                                request.id
                            )}'
                        )"
                    >
                        REJECT
                    </button>

                    `
                    : ""
                }

            </div>

        </article>

    `;
}


async function changeTime(id) {

    const select =
        document.getElementById(
            `time-${id}`
        );


    const time =
        select.value;


    try {

        const response =
            await fetch(
                `/api/requests/${encodeURIComponent(
                    id
                )}/time`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            time
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "TIME CHANGE FAILED."
            );
        }


        showMessage(
            `TIME CHANGED TO ${data.request.time}.`,
            false
        );


        loadRequests();

    } catch (error) {

        showMessage(
            error.message,
            true
        );
    }
}


async function approve(id) {

    await sendAction(
        id,
        "approve"
    );
}


async function reject(id) {

    await sendAction(
        id,
        "reject"
    );
}


async function sendAction(
    id,
    action
) {

    const messageElement =
        document.getElementById(
            `message-${id}`
        );


    const message =
        messageElement
            ? messageElement.value.trim()
            : "";


    try {

        const response =
            await fetch(
                `/api/requests/${encodeURIComponent(
                    id
                )}/${action}`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "ACTION FAILED."
            );
        }


        showMessage(
            action === "approve"
                ? "REQUEST APPROVED."
                : "REQUEST REJECTED.",
            false
        );


        loadRequests();

    } catch (error) {

        showMessage(
            error.message,
            true
        );
    }
}


function showMessage(
    text,
    error
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.className =
        error
            ? "error"
            : "success";
}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeJs(value) {

    return String(
        value ?? ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );
}

</script>

</body>

</html>
