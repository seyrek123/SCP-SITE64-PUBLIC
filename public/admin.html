</main>

<script>

async function loadRequests() {

    const container =
        document.getElementById("requests");

    try {

        const response =
            await fetch("/api/requests");

        const data =
            await response.json();

        if (
            !data.success ||
            !Array.isArray(data.requests)
        ) {
            throw new Error("Invalid response");
        }

        const requests =
            data.requests;

        document.getElementById("total")
            .textContent = requests.length;

        document.getElementById("pending")
            .textContent =
                requests.filter(
                    r => r.status === "PENDING"
                ).length;

        document.getElementById("approved")
            .textContent =
                requests.filter(
                    r => r.status === "APPROVED"
                ).length;

        document.getElementById("rejected")
            .textContent =
                requests.filter(
                    r => r.status === "REJECTED"
                ).length;

        if (!requests.length) {

            container.innerHTML = `
                <div class="empty">
                    NO REQUESTS FOUND.
                </div>
            `;

            return;
        }

        container.innerHTML =
            requests
                .slice()
                .reverse()
                .map(createRequest)
                .join("");

    } catch (error) {

        container.innerHTML = `
            <div class="empty">
                REQUEST DATABASE OFFLINE.
            </div>
        `;
    }
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function createRequest(request) {

    const status =
        String(
            request.status || "PENDING"
        ).toLowerCase();

    return `

        <article class="request">

            <div class="request-top">

                <div class="request-id">
                    ${escapeHtml(request.id)}
                </div>

                <div class="status ${status}">
                    ${escapeHtml(
                        request.status || "PENDING"
                    )}
                </div>

            </div>

            <div class="details">

                <div class="detail">
                    <span>NAME</span>
                    <strong>
                        ${escapeHtml(request.name)}
                    </strong>
                </div>

                <div class="detail">
                    <span>REQUEST TYPE</span>
                    <strong>
                        ${escapeHtml(
                            request.typeName ||
                            request.type ||
                            "UNKNOWN"
                        )}
                    </strong>
                </div>

                <div class="detail">
                    <span>SCP</span>
                    <strong>
                        ${escapeHtml(
                            request.scp || "N/A"
                        )}
                    </strong>
                </div>

                <div class="detail">
                    <span>TIME</span>
                    <strong>
                        ${escapeHtml(
                            request.time || "N/A"
                        )}
                    </strong>
                </div>

            </div>

            ${
                request.message
                ? `
                    <div class="message">
                        <strong>REQUEST MESSAGE</strong>
                        ${escapeHtml(request.message)}
                    </div>
                `
                : ""
            }

            ${
                request.adminMessage
                ? `
                    <div class="message">
                        <strong>ADMIN MESSAGE</strong>
                        ${escapeHtml(
                            request.adminMessage
                        )}
                    </div>
                `
                : ""
            }

            <div class="actions">

                ${
                    request.status === "PENDING"
                    ? `
                        <button
                            class="approve"
                            onclick="approveRequest('${escapeHtml(request.id)}')">
                            APPROVE
                        </button>

                        <button
                            class="reject"
                            onclick="rejectRequest('${escapeHtml(request.id)}')">
                            REJECT
                        </button>
                    `
                    : ""
                }

                <button
                    onclick="changeTime('${escapeHtml(request.id)}')">
                    CHANGE TIME
                </button>

            </div>

        </article>

    `;
}


async function approveRequest(id) {

    const message =
        prompt(
            "ADMIN MESSAGE:",
            "YOUR REQUEST HAS BEEN ACCEPTED."
        );

    if (message === null) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/requests/${encodeURIComponent(id)}/approve`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        message
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "APPROVAL FAILED."
            );

            return;
        }

        loadRequests();

    } catch {

        alert(
            "SERVER CONNECTION ERROR."
        );
    }
}


async function rejectRequest(id) {

    const message =
        prompt(
            "REJECTION MESSAGE:",
            "YOUR REQUEST HAS BEEN REJECTED."
        );

    if (message === null) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/requests/${encodeURIComponent(id)}/reject`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        message
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "REJECTION FAILED."
            );

            return;
        }

        loadRequests();

    } catch {

        alert(
            "SERVER CONNECTION ERROR."
        );
    }
}


async function changeTime(id) {

    const time =
        prompt(
            "NEW TIME (01:00 - 22:00):"
        );

    if (time === null) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/requests/${encodeURIComponent(id)}/time`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        time
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "TIME CHANGE FAILED."
            );

            return;
        }

        loadRequests();

    } catch {

        alert(
            "SERVER CONNECTION ERROR."
        );
    }
}


loadRequests();

setInterval(
    loadRequests,
    10000
);

</script>
