<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITE-64 // WARHEAD</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05070a;
    color: #e5e7eb;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #090c11;
    border-bottom: 1px solid #202733;
    padding: 25px 35px;
}

header h1 {
    margin: 0;
    color: #ef4444;
    font-size: 26px;
    letter-spacing: 3px;
}

header p {
    margin: 7px 0 0;
    color: #64748b;
    font-size: 11px;
    letter-spacing: 2px;
}

.container {
    width: min(1000px, calc(100% - 30px));
    margin: 35px auto;
}

.warning {
    border: 1px solid #7f1d1d;
    background: #100709;
    padding: 18px;
    margin-bottom: 25px;
}

.warning b {
    color: #ef4444;
    letter-spacing: 2px;
}

.status {
    border: 1px solid #202733;
    background: #090c11;
    padding: 18px;
    margin-bottom: 25px;
}

.status span {
    color: #64748b;
    font-size: 11px;
    letter-spacing: 2px;
}

#status {
    color: #22c55e;
    font-weight: bold;
    margin-left: 10px;
}

.section-title {
    color: #94a3b8;
    font-size: 11px;
    letter-spacing: 3px;
    margin: 25px 0 12px;
}

.warheads {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.warhead {
    border: 1px solid #303946;
    background: #0a0e14;
    color: white;
    padding: 20px;
    cursor: pointer;
    text-align: left;
    transition: .2s;
}

.warhead:hover {
    border-color: #ef4444;
}

.warhead.selected {
    border-color: #ef4444;
    background: #18090b;
}

.name {
    color: #ef4444;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.effect {
    margin-top: 10px;
    color: #cbd5e1;
    font-size: 10px;
}

.description {
    margin-top: 7px;
    color: #64748b;
    font-size: 10px;
}

#siteSection {
    display: none;
}

.sites {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.site {
    border: 1px solid #303946;
    background: #0a0e14;
    color: white;
    padding: 18px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
}

.site:hover,
.site.selected {
    border-color: #ef4444;
    background: #18090b;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

button {
    font-family: inherit;
}

#activate {
    border: none;
    background: #b91c1c;
    color: white;
    padding: 15px 25px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
}

#activate:disabled {
    opacity: .35;
    cursor: not-allowed;
}

#deactivate {
    border: 1px solid #475569;
    background: transparent;
    color: #cbd5e1;
    padding: 15px 25px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
}

#deactivate:hover {
    border-color: #ef4444;
    color: #ef4444;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #303946;
    background: #090c11;
    font-size: 12px;
}

.message.show {
    display: block;
}

.message.error {
    color: #fca5a5;
    border-color: #7f1d1d;
}

.message.success {
    color: #86efac;
    border-color: #14532d;
}

.return {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 18px;
    border: 1px solid #303946;
    color: #94a3b8;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
}

.return:hover {
    color: white;
    border-color: #64748b;
}

@media(max-width: 750px) {
    .warheads {
        grid-template-columns: repeat(2, 1fr);
    }

    .sites {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 450px) {
    .warheads {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>SITE-64 // WARHEAD CONTROL</h1>
    <p>SECURE CONTAIN PROTECT // AUTHORIZED PERSONNEL ONLY</p>
</header>

<div class="container">

    <div class="warning">
        <b>⚠ WARNING</b>
        <br><br>
        WARHEAD ACTIVATION IS RESTRICTED.
        ALL ACTIVATION EVENTS ARE LOGGED.
    </div>

    <div class="status">
        <span>WARHEAD STATUS</span>
        <strong id="status">STANDBY</strong>
        <br><br>
        <span>SELECTED</span>
        <strong id="selected">NONE</strong>
    </div>

    <div class="section-title">
        SELECT WARHEAD
    </div>

    <div class="warheads">

        <button class="warhead" data-type="GAMMA">
            <div class="name">GAMMA</div>
            <div class="effect">GLOBAL TERMINATION</div>
            <div class="description">
                TOTAL GLOBAL DESTRUCTION.
            </div>
        </button>

        <button class="warhead" data-type="DELTA">
            <div class="name">DELTA</div>
            <div class="effect">FACILITY TERMINATION</div>
            <div class="description">
                SELECTED FACILITY TERMINATION.
            </div>
        </button>

        <button class="warhead" data-type="ALPHA">
            <div class="name">ALPHA</div>
            <div class="effect">FACILITY TERMINATION</div>
            <div class="description">
                SELECTED FACILITY TERMINATION.
            </div>
        </button>

        <button class="warhead" data-type="BETA">
            <div class="name">BETA</div>
            <div class="effect">FACILITY TERMINATION</div>
            <div class="description">
                SELECTED FACILITY TERMINATION.
            </div>
        </button>

    </div>

    <div id="siteSection">

        <div class="section-title">
            SELECT TARGET SITE
        </div>

        <div class="sites">

            <button class="site" data-site="SITE-19">
                SITE-19
            </button>

            <button class="site" data-site="SITE-51">
                SITE-51
            </button>

            <button class="site" data-site="SITE-64">
                SITE-64
            </button>

        </div>

    </div>

    <div class="actions">

        <button id="activate" disabled>
            ACTIVATE WARHEAD
        </button>

        <button id="deactivate">
            DEACTIVATE
        </button>

    </div>

    <div id="message" class="message"></div>

    <a href="/admin" class="return">
        ← RETURN TO ADMIN
    </a>

</div>

<script>

let selectedType = null;
let selectedSite = null;

const warheadButtons =
    document.querySelectorAll(".warhead");

const siteButtons =
    document.querySelectorAll(".site");

const siteSection =
    document.getElementById("siteSection");

const activateButton =
    document.getElementById("activate");

const deactivateButton =
    document.getElementById("deactivate");

const statusElement =
    document.getElementById("status");

const selectedElement =
    document.getElementById("selected");

const messageElement =
    document.getElementById("message");


function message(text, type) {

    messageElement.textContent = text;

    messageElement.className =
        "message show " + (type || "");

}


function updateActivate() {

    if (!selectedType) {

        activateButton.disabled = true;
        return;

    }

    if (
        selectedType !== "GAMMA" &&
        !selectedSite
    ) {

        activateButton.disabled = true;
        return;

    }

    activateButton.disabled = false;

}


warheadButtons.forEach(button => {

    button.addEventListener("click", () => {

        warheadButtons.forEach(
            b => b.classList.remove("selected")
        );

        siteButtons.forEach(
            b => b.classList.remove("selected")
        );

        button.classList.add("selected");

        selectedType =
            button.dataset.type;

        selectedSite = null;

        selectedElement.textContent =
            selectedType;

        if (selectedType === "GAMMA") {

            siteSection.style.display =
                "none";

        } else {

            siteSection.style.display =
                "block";

        }

        updateActivate();

        message(
            selectedType +
            " WARHEAD SELECTED.",
            "success"
        );

    });

});


siteButtons.forEach(button => {

    button.addEventListener("click", () => {

        siteButtons.forEach(
            b => b.classList.remove("selected")
        );

        button.classList.add("selected");

        selectedSite =
            button.dataset.site;

        updateActivate();

        message(
            "TARGET SELECTED: " +
            selectedSite,
            "success"
        );

    });

});


activateButton.addEventListener(
    "click",
    async () => {

        if (!selectedType) {
            return;
        }

        if (
            selectedType !== "GAMMA" &&
            !selectedSite
        ) {

            message(
                "SELECT A TARGET SITE.",
                "error"
            );

            return;

        }

        activateButton.disabled = true;

        try {

            const response =
                await fetch(
                    "/api/warhead/activate",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                type:
                                    selectedType,
                                site:
                                    selectedSite
                            })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "WARHEAD ACTIVATION FAILED."
                );

            }

            statusElement.textContent =
                data.warhead.status ||
                "ARMED";

            message(
                "WARHEAD ACTIVATED.",
                "success"
            );

        } catch (error) {

            message(
                error.message,
                "error"
            );

            updateActivate();

        }

    }
);


deactivateButton.addEventListener(
    "click",
    async () => {

        try {

            const response =
                await fetch(
                    "/api/warhead/deactivate",
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "DEACTIVATION FAILED."
                );

            }

            selectedType = null;
            selectedSite = null;

            statusElement.textContent =
                "STANDBY";

            selectedElement.textContent =
                "NONE";

            warheadButtons.forEach(
                b => b.classList.remove("selected")
            );

            siteButtons.forEach(
                b => b.classList.remove("selected")
            );

            siteSection.style.display =
                "none";

            updateActivate();

            message(
                "WARHEAD SYSTEM DEACTIVATED.",
                "success"
            );

        } catch (error) {

            message(
                error.message,
                "error"
            );

        }

    }
);


async function loadWarhead() {

    try {

        const response =
            await fetch("/api/warhead");

        const data =
            await response.json();

        if (!data.success) {
            return;
        }

        const warhead =
            data.warhead;

        statusElement.textContent =
            warhead.status ||
            "STANDBY";

        if (warhead.active) {

            selectedType =
                warhead.type;

            selectedElement.textContent =
                warhead.type;

            warheadButtons.forEach(
                button => {

                    if (
                        button.dataset.type ===
                        warhead.type
                    ) {

                        button.classList.add(
                            "selected"
                        );

                    }

                }
            );

            if (
                warhead.type !== "GAMMA"
            ) {

                siteSection.style.display =
                    "block";

            }

            activateButton.disabled =
                true;

        }

    } catch {

        statusElement.textContent =
            "OFFLINE";

    }

}


loadWarhead();

</script>

</body>
</html>
