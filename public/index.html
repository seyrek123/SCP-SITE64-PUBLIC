<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SCP FOUNDATION // SITE-64</title>

<link
    rel="stylesheet"
    href="/script.css"
>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-title">
            SCP FOUNDATION
        </div>

        <div class="brand-subtitle">
            SITE-64
        </div>

    </div>


    <nav class="navigation">

        <a
            href="/"
            class="active"
        >
            HOME
        </a>

        <a href="#request">
            REQUEST
        </a>

        <a href="/sites">
            SITES
        </a>

        <a href="/term">
            TERMINAL
        </a>

        <a href="/admin">
            ADMIN
        </a>

    </nav>

</header>


<main>


<section
    class="page-section"
    id="home"
>

    <h1>
        SITE-64
    </h1>

    <p>
        SECURE CONTAIN PROTECT
    </p>

    <p>
        SITE-64 FOUNDATION INFORMATION SYSTEM
    </p>

</section>


<section
    class="page-section"
    id="request"
>

    <h2>
        REQUEST ACCESS
    </h2>


    <form
        id="requestForm"
    >


        <label>
            FULL NAME
        </label>

        <input
            id="name"
            name="name"
            type="text"
            required
            autocomplete="name"
        >


        <label>
            REQUEST TYPE
        </label>

        <select
            id="type"
            name="type"
            required
        >

            <option
                value=""
            >
                SELECT REQUEST TYPE
            </option>

            <option
                value="scp"
            >
                SCP INSPECTION
            </option>

            <option
                value="research"
            >
                RESEARCH ACCESS
            </option>

            <option
                value="site"
            >
                SITE ACCESS
            </option>

            <option
                value="personnel"
            >
                PERSONNEL REQUEST
            </option>

            <option
                value="other"
            >
                OTHER
            </option>

        </select>


        <div
            id="scpGroup"
            style="display:none;"
        >

            <label>
                SCP DESIGNATION
            </label>

            <input
                id="scp"
                name="scp"
                type="text"
                placeholder="SCP-173"
            >

        </div>


        <label>
            REQUEST TIME
        </label>

        <select
            id="time"
            name="time"
            required
        >

            <option value="">
                SELECT TIME
            </option>

            <option>12:00 PM</option>
            <option>12:30 PM</option>

            <option>1:00 PM</option>
            <option>1:30 PM</option>

            <option>2:00 PM</option>
            <option>2:30 PM</option>

            <option>3:00 PM</option>
            <option>3:30 PM</option>

            <option>4:00 PM</option>
            <option>4:30 PM</option>

            <option>5:00 PM</option>
            <option>5:30 PM</option>

            <option>6:00 PM</option>
            <option>6:30 PM</option>

            <option>7:00 PM</option>
            <option>7:30 PM</option>

            <option>8:00 PM</option>
            <option>8:30 PM</option>

            <option>9:00 PM</option>
            <option>9:30 PM</option>

            <option>10:00 PM</option>
            <option>10:30 PM</option>

            <option>11:00 PM</option>
            <option>11:30 PM</option>

            <option>12:00 AM</option>

        </select>


        <label>
            MESSAGE
        </label>

        <textarea
            id="message"
            name="message"
            placeholder="REQUEST DETAILS..."
        ></textarea>


        <button
            type="submit"
        >
            SUBMIT REQUEST
        </button>


        <div
            id="result"
            class="result"
        ></div>


    </form>

</section>


<section
    class="page-section"
    id="myRequests"
>

    <h2>
        MY REQUESTS
    </h2>


    <div
        id="myRequestsList"
    >

        <div>
            NO REQUESTS FOUND.
        </div>

    </div>

</section>


</main>


<script src="/script.js"></script>

</body>

</html>
