<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SITE-64</title>

<link
    rel="stylesheet"
    href="/script.css"
>

</head>

<body>

<header class="topbar">

    <div class="logo">
        SECURECONTAINPROTECT
    </div>

    <nav>

        <a href="#home">
            HOME
        </a>

        <a href="#request">
            REQUEST
        </a>

        <a href="#status">
            STATUS
        </a>

    </nav>

</header>


<main>

<section
    id="home"
    class="hero page-section"
>

    <div class="hero-content">

        <div class="classification">
            CLASSIFIED // SITE-64
        </div>

        <h1>
            SITE-64
        </h1>

        <p>
            SECURE CONTAIN PROTECT
        </p>

        <a
            href="#request"
            class="button"
        >
            SUBMIT REQUEST
        </a>

    </div>

</section>


<section
    id="request"
    class="page-section section"
>

    <div class="section-title">

        <span>
            REQUEST SYSTEM
        </span>

        <h2>
            ACCESS REQUEST
        </h2>

    </div>


    <form
        id="requestForm"
        class="request-form"
    >

        <label>
            FULL NAME

            <input
                id="name"
                type="text"
                required
                autocomplete="name"
            >

        </label>


        <label>
            REQUEST TYPE

            <select
                id="type"
                required
            >

                <option value="">
                    SELECT REQUEST TYPE
                </option>

                <option value="scp">
                    SCP DENETİMİ
                </option>

                <option value="facility">
                    FACILITY ACCESS
                </option>

                <option value="research">
                    RESEARCH REQUEST
                </option>

                <option value="personnel">
                    PERSONNEL REQUEST
                </option>

                <option value="security">
                    SECURITY REQUEST
                </option>

                <option value="equipment">
                    EQUIPMENT REQUEST
                </option>

                <option value="other">
                    OTHER
                </option>

            </select>

        </label>


        <label
            id="scpGroup"
            style="display:none;"
        >

            SCP

            <select id="scp">

                <option value="">
                    SELECT SCP
                </option>

                <option value="SCP-049">
                    SCP-049
                </option>

                <option value="SCP-096">
                    SCP-096
                </option>

                <option value="SCP-173">
                    SCP-173
                </option>

                <option value="SCP-682">
                    SCP-682
                </option>

                <option value="SCP-939">
                    SCP-939
                </option>

                <option value="SCP-106">
                    SCP-106
                </option>

                <option value="SCP-3008">
                    SCP-3008
                </option>

            </select>

        </label>


        <label>
            TIME

            <select
                id="time"
                required
            >

                <option value="">
                    SELECT TIME
                </option>

                <option value="12:00">
                    12:00
                </option>

                <option value="12:30">
                    12:30
                </option>

                <option value="13:00">
                    13:00
                </option>

                <option value="13:30">
                    13:30
                </option>

                <option value="14:00">
                    14:00
                </option>

                <option value="14:30">
                    14:30
                </option>

                <option value="15:00">
                    15:00
                </option>

                <option value="15:30">
                    15:30
                </option>

                <option value="16:00">
                    16:00
                </option>

                <option value="16:30">
                    16:30
                </option>

                <option value="17:00">
                    17:00
                </option>

                <option value="17:30">
                    17:30
                </option>

                <option value="18:00">
                    18:00
                </option>

                <option value="18:30">
                    18:30
                </option>

                <option value="19:00">
                    19:00
                </option>

                <option value="19:30">
                    19:30
                </option>

                <option value="20:00">
                    20:00
                </option>

                <option value="20:30">
                    20:30
                </option>

                <option value="21:00">
                    21:00
                </option>

                <option value="21:30">
                    21:30
                </option>

                <option value="22:00">
                    22:00
                </option>

                <option value="22:30">
                    22:30
                </option>

                <option value="23:00">
                    23:00
                </option>

                <option value="23:30">
                    23:30
                </option>

                <option value="00:00">
                    00:00
                </option>

            </select>

        </label>


        <label>
            MESSAGE

            <textarea
                id="message"
                rows="6"
                placeholder="REQUEST DETAILS..."
            ></textarea>

        </label>


        <button
            type="submit"
            class="button"
        >
            SUBMIT REQUEST
        </button>


        <div
            id="result"
            class="result"
        ></div>

    </form>

</section>


<section
    id="status"
    class="page-section section"
>

    <div class="section-title">

        <span>
            SYSTEM
        </span>

        <h2>
            SYSTEM STATUS
        </h2>

    </div>


    <div class="status-grid">

        <div class="status-box">

            <span>
                SERVER
            </span>

            <strong id="serverStatus">
                SYSTEMS CHECKING...
            </strong>

        </div>


        <div class="status-box">

            <span>
                DATABASE
            </span>

            <strong id="databaseStatus">
                SYSTEMS CHECKING...
            </strong>

        </div>


        <div class="status-box">

            <span>
                REQUEST SYSTEM
            </span>

            <strong id="requestStatus">
                SYSTEMS CHECKING...
            </strong>

        </div>

    </div>

</section>

</main>


<footer>

    SECURECONTAINPROTECT // SITE-64

</footer>


<script src="/script.js"></script>

</body>

</html>
